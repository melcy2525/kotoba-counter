
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことばの100回習慣</title>
<style>
body{font-family:system-ui;text-align:center;background:#fff5f7;color:#382b32;padding:20px}
h1{font-size:24px}
.card{background:white;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 3px 15px #0001}
.count{font-size:54px;font-weight:bold;margin:10px}
button{border:0;border-radius:15px;padding:16px;margin:5px;font-size:18px;background:#e77b9b;color:white}
.small{background:#ddd;color:#333}
progress{width:100%;height:16px}
</style>
</head>
<body>
<h1>❤️ ことばの100回習慣</h1>
<p id="date"></p>
<div id="app"></div>
<p id="status"></p>
<script>
const today=()=>new Date().toLocaleDateString("sv-SE");
const key="kotoba-records";
let records={};
try{records=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
function data(){return records[today()]||(records[today()]={thanks:0,love:0})}
function save(){localStorage.setItem(key,JSON.stringify(records));render()}
function change(k,n){data()[k]=Math.max(0,Math.min(100,data()[k]+n));save()}
function render(){
document.getElementById("date").textContent=today();
let d=data();
document.getElementById("app").innerHTML=[
["thanks","🙏 ありがとう"],["love","❤️ 愛してる"]
].map(([k,name])=>`
<div class="card">
<h2>${name}</h2>
<div class="count">${d[k]} / 100</div>
<progress value="${d[k]}" max="100"></progress>
<div>
<button onclick="change('${k}',1)">＋1</button>
<button class="small" onclick="change('${k}',-1)">−1</button>
</div>
</div>`).join("");
document.getElementById("status").textContent=
d.thanks===100&&d.love===100?
"🎉 今日の目標達成！":
"あと"+(200-d.thanks-d.love)+"回！";
}
render();
setInterval(()=>{if(document.getElementById("date").textContent!==today())render()},30000);
</script>
</body>
</html>
