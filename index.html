
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f6">
<title>ことばの100回習慣</title>
<style>
* { box-sizing: border-box; }
html {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  padding: 20px 16px 50px;
  background: #fff3f6;
  color: #42323a;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  touch-action: manipulation;
}
h1 { font-size: 25px; margin: 15px 0 6px; }
.subtitle { font-size: 13px; color: #8b7680; }
.card {
  background: white;
  border-radius: 22px;
  padding: 22px 18px;
  margin: 16px 0;
  box-shadow: 0 5px 20px #b66b8715;
}
h2 { font-size: 20px; margin: 0 0 12px; }
.number { font-size: 52px; font-weight: 800; }
.target { font-size: 16px; color: #a38d98; }
progress {
  width: 100%;
  height: 14px;
  accent-color: #e77d9c;
  margin: 12px 0;
}
button {
  border: 0;
  border-radius: 16px;
  padding: 16px 20px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  background: #e77d9c;
  color: white;
  margin: 5px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
button:active { opacity: 0.75; }
button:disabled { opacity: 0.45; }
.countButton {
  width: 65%;
  max-width: 260px;
  height: 95px;
  font-size: 34px;
  border-radius: 22px;
}
.minusButton {
  background: #eee4e8;
  color: #55434d;
  font-size: 16px;
  padding: 12px 25px;
}
.mic {
  background: #b64e78;
  width: 90%;
  max-width: 360px;
}
.mic.active { background: #d33e58; }
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stats .card { margin: 0; padding: 18px 8px; }
.statnum { font-size: 30px; font-weight: 800; }
.label { font-size: 12px; color: #8a7880; }
.totalBox {
  background: #fff3f6;
  border-radius: 18px;
  padding: 20px;
  margin: 12px 0;
}
.totalName { font-size: 18px; margin-bottom: 10px; }
#message {
  font-size: 14px;
  color: #8a6274;
  line-height: 1.7;
}
</style>
</head>
<body>

<h1>❤️ ことばの100回習慣</h1>
<p class="subtitle" id="date"></p>

<div class="card">
  <h2>🎤 音声カウント</h2>
  <button class="mic" id="micButton" onclick="toggleMic()">
    🎤 音声認識を開始
  </button>
  <p id="message">
    ボタンを押して「ありがとう」「愛してる」と話してね
  </p>
</div>

<div id="counters"></div>

<div class="stats">
  <div class="card">
    <div class="label">🔥 連続達成</div>
    <div class="statnum" id="streak">0日</div>
  </div>
  <div class="card">
    <div class="label">🏆 達成日数</div>
    <div class="statnum" id="days">0日</div>
  </div>
</div>

<div class="card">
  <h2>💎 これまでの累計</h2>
  <div class="totalBox">
    <div class="totalName">🙏 ありがとう</div>
    <div class="statnum" id="totalThanks">0回</div>
  </div>
  <div class="totalBox">
    <div class="totalName">❤️ 愛してる</div>
    <div class="statnum" id="totalLove">0回</div>
  </div>
</div>

<script>
const STORAGE_KEY = "kotoba-counter-v2";
const REPAIRED_DAYS_KEY = "kotoba-repaired-days";
const FIX_KEY = "kotoba-fix-8days-800-v2";

function loadJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value === null ? fallback : value;
  } catch (e) {
    return fallback;
  }
}

let records = loadJSON(STORAGE_KEY, {});
if (!records || typeof records !== "object" || Array.isArray(records)) {
  records = {};
}

function dateKey(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function today() {
  return dateKey(new Date());
}

function getDay() {
  const key = today();
  if (!records[key]) {
    records[key] = { thanks: 0, love: 0 };
  }
  return records[key];
}

function completed(d) {
  return !!d &&
    Number(d.thanks || 0) >= 100 &&
    Number(d.love || 0) >= 100;
}

// 2026年11月1日〜8日の達成記録を補正
// この補正は一度だけ実行する
function repairAchievements() {
  if (localStorage.getItem(FIX_KEY) === "done") return;

  const dates = [
    "2026-11-01",
    "2026-11-02",
    "2026-11-03",
    "2026-11-04",
    "2026-11-05",
    "2026-11-06",
    "2026-11-07",
    "2026-11-08"
  ];

  // 以前の9日間補正を解除
  const repaired = loadJSON(REPAIRED_DAYS_KEY, []);
  const previous = Array.isArray(repaired) ? repaired : [];

  // 対象期間は実際の記録で管理し、
  // 対象外の補正済み日付は残す
  const corrected = previous.filter(
    date => !dates.includes(date) &&
      date !== "2026-11-09"
  );

  dates.forEach(date => {
    records[date] = {
      thanks: 100,
      love: 100
    };
  });

  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(records)
    );

    localStorage.setItem(
      REPAIRED_DAYS_KEY,
      JSON.stringify(corrected)
    );

    localStorage.setItem(
      "kotoba-repair-9days-v2",
      "done"
    );

    localStorage.setItem(FIX_KEY, "done");
  } catch (e) {
    console.error("達成記録の補正に失敗しました", e);
  }
}

repairAchievements();

function getAchievedDays() {
  const repaired = loadJSON(REPAIRED_DAYS_KEY, []);
  const dates = new Set(
    Array.isArray(repaired) ? repaired : []
  );

  Object.entries(records).forEach(([key, r]) => {
    if (completed(r)) dates.add(key);
  });

  return dates;
}

function calculateStreak() {
  const achieved = getAchievedDays();
  const d = new Date();
  d.setHours(12, 0, 0, 0);

  if (!achieved.has(dateKey(d))) {
    d.setDate(d.getDate() - 1);
  }

  let count = 0;

  while (achieved.has(dateKey(d))) {
    count++;
    d.setDate(d.getDate() - 1);
  }

  return count;
}

function setMessage(message) {
  document.getElementById("message").textContent = message;
}

function save() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(records)
    );
  } catch (e) {
    setMessage("記録を保存できませんでした");
  }
  render();
}

function change(type, amount) {
  const d = getDay();
  d[type] = Math.max(
    0,
    Number(d[type] || 0) + amount
  );
  save();
}

function render() {
  const d = getDay();

  document.getElementById("date").textContent =
    new Date().toLocaleDateString("ja-JP", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    });

  const items = [
    ["thanks", "🙏 ありがとう"],
    ["love", "❤️ 愛してる"]
  ];

  document.getElementById("counters").innerHTML =
    items.map(([key, name]) => `
      <div class="card">
        <h2>${name}</h2>
        <div class="number">
          ${Number(d[key] || 0)}
          <span class="target">/ 100</span>
        </div>
        <progress
          value="${Math.min(Number(d[key] || 0), 100)}"
          max="100">
        </progress>
        <div>
          <button class="countButton"
            onclick="change('${key}', 1)">
            ＋1
          </button>
        </div>
        <div>
          <button class="minusButton"
            onclick="change('${key}', -1)">
            −1 戻す
          </button>
        </div>
      </div>
    `).join("");

  let totalThanks = 0;
  let totalLove = 0;

  Object.values(records).forEach(r => {
    totalThanks += Number(r.thanks || 0);
    totalLove += Number(r.love || 0);
  });

  document.getElementById("totalThanks").textContent =
    totalThanks.toLocaleString() + "回";

  document.getElementById("totalLove").textContent =
    totalLove.toLocaleString() + "回";

  document.getElementById("streak").textContent =
    calculateStreak() + "日";

  document.getElementById("days").textContent =
    getAchievedDays().size + "日";
}

render();
setInterval(render, 30000);

// 音声認識
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

function updateMic() {
  const button = document.getElementById("micButton");

  button.textContent = listening
    ? "■ 音声認識を停止"
    : "🎤 音声認識を開始";

  button.classList.toggle("active", listening);
}

function countSpeech(text) {
  const normalized = text.replace(/\s/g, "");

  const thanks =
    (normalized.match(/ありがとう/g) || []).length;

  const love =
    (normalized.match(/愛してる|愛している/g) || []).length;

  if (thanks || love) {
    const d = getDay();

    d.thanks = Number(d.thanks || 0) + thanks;
    d.love = Number(d.love || 0) + love;

    save();
    setMessage("認識：" + text);
  } else {
    setMessage(
      "認識：" + text + "（対象の言葉なし）"
    );
  }
}

function toggleMic() {
  if (!SpeechRecognition) {
    setMessage(
      "このブラウザでは音声認識が使えません。手動ボタンを使ってね。"
    );
    return;
  }

  if (listening) {
    listening = false;
    if (recognition) recognition.stop();
    updateMic();
    return;
  }

  listening = true;
  recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = event => {
    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      if (event.results[i].isFinal) {
        countSpeech(
          event.results[i][0].transcript
        );
      }
    }
  };

  recognition.onerror = event => {
    setMessage(
      "音声認識エラー：" + event.error
    );

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      listening = false;
      updateMic();
    }
  };

  recognition.onend = () => {
    if (listening) {
      try {
        recognition.start();
      } catch (e) {
        listening = false;
        updateMic();
      }
    }
  };

  try {
    recognition.start();
    setMessage(
      "聞き取り中… 言葉を話してね！"
    );
    updateMic();
  } catch (e) {
    listening = false;
    updateMic();
    setMessage(
      "音声認識を開始できませんでした"
    );
  }
}
</script>
</body>
</html>
